name: Publicar Atlas no GitHub Pages
on:
  push:
    branches: [master]
    paths: [frontend/**, deploy/public-config.json, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Configurar origem HTTPS pública da API
        env:
          API_URL: ${{ vars.API_BASE_URL }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from urllib.parse import urlsplit
          url=(os.environ.get('API_URL') or json.loads(Path('deploy/public-config.json').read_text())['apiBaseUrl']).rstrip('/')
          parsed=urlsplit(url)
          assert parsed.scheme=='https' and parsed.hostname and not parsed.username and not parsed.password and parsed.path=='' and not parsed.query and not parsed.fragment, 'Configure API_BASE_URL como origem HTTPS'
          Path('frontend/public/api-config.json').write_text(json.dumps({'apiBaseUrl':url}))
          PY
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build para o caminho do Pages
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        working-directory: frontend
        run: npm run build -- --base-href "${BASE_PATH}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist/frontend/browser
  deploy:
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
