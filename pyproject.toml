[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eleicoes-sp"
version = "0.1.0"
description = "Análise dos votos de São Paulo nas eleições de 2026"
requires-python = ">=3.12"
dependencies = ["duckdb==1.5.6", "fastapi==0.152.0", "uvicorn==0.54.0", "shapely==2.2.0", "pyshp==3.1.6", "pyproj==3.8.0"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[project.scripts]
eleicoes = "eleicoes_sp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
